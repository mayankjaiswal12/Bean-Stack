name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create firebase-config.js from secret
        run: |
          cat > firebase-config.js << 'EOF'
          export const firebaseConfig = ${{ secrets.FIREBASE_CONFIG_JSON }};
          EOF

      - name: Prepare deploy folder
        run: |
          mkdir -p /tmp/_site
          shopt -s dotglob
          for item in *; do
            if [ "$item" != ".github" ] && [ "$item" != ".git" ]; then
              cp -r "$item" /tmp/_site/
            fi
          done
          rm -rf _site
          mv /tmp/_site ./_site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
