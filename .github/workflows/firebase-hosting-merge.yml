# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recipe generator
        run: node --test

      - name: Create firebase-config.js from secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo '::error::Set the FIREBASE_CONFIG_JSON repository secret.'
            exit 1
          fi
          printf 'export const firebaseConfig = %s;\n' "$FIREBASE_CONFIG_JSON" > public/firebase-config.js
          node --check public/firebase-config.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COFFEE_DATABASE_92533 }}
          channelId: live
          projectId: coffee-database-92533
          target: beanstack-target
